<html lang="en">
  <head><meta charset="utf-8"><title>OIDC Login</title></head>

    <h1>Sign in</h1>

      {% csrf_token %}
      {{ form.as_p }}

      <input type="hidden" name="next" value="{{ next }}">
    </form>
  </body>
</html>
